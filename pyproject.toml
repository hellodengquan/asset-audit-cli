[project]
name = "asset-audit-cli"
version = "0.1.0"
description = "小型资产盘点 CLI 工具"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
asset-audit = "asset_audit_cli.main:app"

[tool.setuptools.packages.find]
include = ["asset_audit_cli*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
